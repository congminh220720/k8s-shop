# Local development only. In the cluster, the DB is Cloud SQL.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      retries: 10

  api:
    build: ./shop-api
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: shop
      DB_PASSWORD: shop
      DB_NAME: shop
      DB_SSL: "false"
      DB_RUN_MIGRATIONS: "true"
    ports: ["3001:3000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./shop-frontend
    environment:
      API_URL: http://api:3000
    ports: ["3000:3000"]
    depends_on: [api]
