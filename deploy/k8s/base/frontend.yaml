apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-frontend
  labels: { app: shop-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop-frontend }
  template:
    metadata:
      labels: { app: shop-frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: frontend
          image: shop-frontend
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: API_URL, value: "http://shop-api" }
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-frontend
spec:
  selector: { app: shop-frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
